<!doctype html>
<!-- AE Mentor panel (specs/003-mentor-panel). Layout from product/mockups/ae-panel.md. -->
<html>
  <head>
    <meta charset="utf-8" />
    <title>AE Mentor</title>
    <link rel="stylesheet" href="./panel.css" />
  </head>
  <body>
    <header id="conn" class="conn"><span class="dot"></span><span id="conn-text">AE Mentor</span></header>

    <section id="path" class="block path" hidden></section>
    <section id="stage" class="block stage" hidden></section>

    <main id="conversation" class="conversation" aria-live="polite">
      <p class="empty" id="empty">Open your comp, then start a lesson. The mentor looks at your keyframes and leads from there.</p>
    </main>

    <div id="status" class="status" hidden><span class="spinner"></span><span id="status-text"></span></div>

    <section id="check" class="block check" hidden>
      <h2>Check</h2>
      <p id="check-summary" class="check-summary"></p>
      <ul id="check-rows" class="check-rows"></ul>
      <div id="check-outside" class="check-outside" hidden>
        <h3>Outside this lesson</h3>
        <ul id="check-outside-rows"></ul>
      </div>
      <p id="check-stale" class="check-stale" hidden>From your last check</p>
    </section>

    <nav id="buttons" class="buttons"></nav>

    <form id="ask" class="ask" autocomplete="off">
      <input id="ask-input" type="text" placeholder="Ask the mentor…" disabled />
      <button id="ask-send" type="submit" disabled aria-label="Send">⏎</button>
    </form>

    <footer id="memory" class="block memory" hidden></footer>

    <script src="./main.js"></script>
  </body>
</html>
